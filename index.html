<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectre Scoring – Version 1.0</title>
<meta name="description" content="Spectre Tactical Shooting match scoring – offline">
<meta name="theme-color" content="#14284b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spectre Scoring">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#f2f3f6; --card:#fff; --text:#000; --muted:#3d4350; --border:#5d6576; --line:#c9cdd6;
  --navy:#14284b; --gold:#c9971f; --accent:#1f4f9f; --ok:#0f7a2e; --ok-bg:#dff3e4; --warn:#8a5200; --warn-bg:#fff1cc; --bad:#b0120e; --bad-bg:#fde3e1;
  --btn:#fff; --btn-text:#000; --chip:#e7eaf0;
  --cond:"Barlow Condensed",Bahnschrift,"Arial Narrow","Roboto Condensed",sans-serif;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
body.dark{ --bg:#06090f; --card:#121826; --text:#fff; --muted:#c3c9d6; --border:#8d97ab; --line:#2c3445; --btn:#1b2333; --btn-text:#fff; --chip:#222b3d;
  --accent:#7fb0ff; --ok:#5fe08a; --ok-bg:#0f2e1a; --warn:#ffc65c; --warn-bg:#33270a; --bad:#ff7b72; --bad-bg:#3a1210; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:calc(var(--tabh) + var(--safe-b))}
body.big{font-size:20px}
button{font:inherit;font-weight:600;min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--btn);color:var(--btn-text);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
body.dark button.primary{background:#2a5bd7;border-color:#2a5bd7}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
body.dark button.ok{color:#000}
button.danger{color:var(--bad);border-color:var(--bad)}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark button.on{background:#2a5bd7;border-color:#2a5bd7}
button:disabled{opacity:.4}
button.wide{width:100%}
button.slim{min-height:40px;padding:4px 10px;font-size:.9em}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-height:50px}
input[type=checkbox]{width:28px;height:28px;min-height:0;accent-color:var(--navy)}
label{display:block;font-size:.85em;font-weight:600;color:var(--muted);margin:10px 0 4px}
h2{font-family:var(--cond);font-size:1.45em;margin:4px 0 10px;letter-spacing:.01em;text-transform:uppercase}
h3{font-family:var(--cond);font-size:1.15em;margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)} .small{font-size:.85em}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}
.brand{font-family:var(--cond);font-size:1.3em;font-weight:800;white-space:nowrap}
.brand b{color:var(--gold)} .brand .ver{font-size:.6em;opacity:.8;font-weight:500;margin-left:4px}
.devchip{min-height:36px;padding:3px 10px;font-size:.8em;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:12px;max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--border);padding-bottom:var(--safe-b)}
.tabs button{border:0;border-radius:0;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.78em;background:transparent;color:var(--muted)}
.tabs button .ti{font-size:1.45em;line-height:1}
.tabs button.on{color:var(--text);background:var(--chip);box-shadow:inset 0 4px 0 var(--gold)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1 1 auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:.78em;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.msg{border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:600;font-size:.9em}
.msg.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok)} .msg.info{background:var(--chip)}
/* stage cards */
.stcard{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:8px;min-height:96px;border-radius:14px;margin:0 0 10px;background:var(--card)}
.stcard .thumb{flex:0 0 110px;height:80px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden}
.stcard .thumb svg{width:100%;height:100%}
.stcard .info{flex:1;min-width:0}
.stcard .tt{font-family:var(--cond);font-size:1.2em;font-weight:800;line-height:1.1}
.prog{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
/* shooter list */
.shrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:60px;margin:0 0 8px;background:var(--card)}
.shrow .nm{flex:1;min-width:0}.shrow .nm b{display:block;font-size:1.05em}
.shrow.done{border-color:var(--ok)} .shrow.next{border-width:3px;border-color:var(--gold)}
.shrow .sc{font-weight:800;white-space:nowrap}
.nextbar{position:sticky;bottom:calc(var(--tabh) + var(--safe-b) + 6px);z-index:5;margin-top:8px}
.nextbar button{width:100%;min-height:62px;font-size:1.1em;box-shadow:0 4px 16px rgba(0,0,0,.25)}
/* scoring entry */
.ehead{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);margin:-12px -12px 10px;padding:8px 12px;border-bottom:2px solid var(--line)}
.ehead .who{font-size:1.2em;font-weight:800;line-height:1.15}
.timebox input{font-size:2em;font-weight:800;text-align:center;letter-spacing:.02em;min-height:70px;font-variant-numeric:tabular-nums}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px}
.tcard.err{border-color:var(--bad)} .tcard.done{border-color:var(--ok)}
.tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.tcard .th b{font-size:1.15em}
.ctr{display:grid;grid-template-columns:minmax(78px,1fr) 64px 58px 64px;align-items:center;gap:6px;margin:5px 0}
.ctr .lab{font-weight:700}
.ctr button{min-height:56px;font-size:1.6em;padding:0;line-height:1}
.ctr .val{text-align:center;font-size:1.6em;font-weight:800;font-variant-numeric:tabular-nums}
.ctr.auto .val{color:var(--bad)} .ctr.auto .lab small{font-weight:500;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:5px 0}
.seg button{min-height:58px}
.fte{margin-top:6px;min-height:44px;width:100%;font-size:.9em}
.fte.on{background:var(--bad);border-color:var(--bad);color:#fff}
.livebar{position:sticky;bottom:calc(var(--tabh) + var(--safe-b));z-index:12;margin:12px -12px -12px;padding:8px 12px calc(8px);background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center}
body.entry .livebar{bottom:0} body.entry{padding-bottom:0} body.entry .tabs{display:none}
.livebar .live{flex:1;min-width:0}.livebar .live b{display:block;font-size:1.7em;line-height:1.05;font-variant-numeric:tabular-nums}
.livebar button{min-height:60px;font-size:1.1em;background:var(--gold);border-color:var(--gold);color:#000;padding:8px 18px}
.breakdown{font-size:.9em;margin:4px 0 0;padding-left:18px}
.sigpad{width:100%;height:170px;background:#fff;border:2px dashed var(--border);border-radius:12px;touch-action:none;display:block}
.agree{display:flex;align-items:center;gap:12px;font-size:1.1em;font-weight:700;padding:10px;border:3px solid var(--border);border-radius:12px;background:var(--card);margin:10px 0;cursor:pointer}
.agree input{width:34px;height:34px}
.agree.on{border-color:var(--ok);background:var(--ok-bg)}
/* results */
.restabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.restabs button{flex:0 0 auto;min-height:44px}
.rtable{width:100%;border-collapse:collapse;font-size:.88em;background:var(--card)}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
.rtable th{font-size:.8em;text-transform:uppercase;color:var(--muted)}
.rtable td.n,.rtable th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable .pl{font-weight:800;font-size:1.1em;width:32px}
.rtable tr.un td{color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:2px solid var(--line)}
/* merge */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp > div{border:2px solid var(--line);border-radius:10px;padding:8px;font-size:.88em}
.cmp .tot{font-size:1.35em;font-weight:800}
/* overlays */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal[hidden],.overlay[hidden]{display:none}
.mbox{background:var(--card);color:var(--text);border-radius:16px;padding:16px;width:100%;max-width:520px;margin-bottom:var(--safe-b);max-height:85vh;overflow:auto}
#mBody{white-space:pre-wrap;font-size:1.02em;margin-bottom:10px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.overlay{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + var(--safe-b))}
.qrbox{background:#fff;padding:8px;border-radius:12px;max-width:min(92vw,62vh);margin:8px auto}
.qrbox svg{width:100%;height:auto;display:block}
.scanv{width:100%;max-height:55vh;background:#000;border-radius:12px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe-b) + 14px);z-index:120;background:#111;color:#fff;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:600;display:none;align-items:center;gap:12px;max-width:94vw;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.show{display:flex}
.toast button{min-height:40px;background:var(--gold);color:#000;border-color:var(--gold)}
body.entry .toast{bottom:100px}
.offline{display:none}
.diag{background:#fff;border-radius:10px;border:1px solid var(--line);margin:6px 0;height:220px}.diag svg{width:100%;height:100%}
details > summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.list-plain{list-style:none;margin:0;padding:0}.list-plain li{padding:8px 0;border-bottom:1px solid var(--line)}
.printarea{display:none}
@media (min-width:600px){ .grid2.w3{grid-template-columns:1fr 1fr 1fr} }
@media print{
  body{background:#fff;color:#000;padding:0;font-size:10.5pt}
  body > *:not(.printarea){display:none!important}
  .printarea{display:block!important}
  .printarea h1{font-family:var(--cond);font-size:16pt;margin:0 0 2mm}
  .printarea h2{font-size:12.5pt;margin:5mm 0 2mm;break-after:avoid}
  .printarea table{width:100%;border-collapse:collapse;font-size:9pt;break-inside:auto}
  .printarea th,.printarea td{border:0.6pt solid #888;padding:1.2mm 1.6mm;text-align:left}
  .printarea td.n{text-align:right}
  .printarea tr{break-inside:avoid}
  .printarea .pg{break-before:page}
  .printarea{position:relative}
  .printarea .prlogo{position:absolute;right:0;top:0;width:22mm;height:7.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .printarea .prlogo .splogo{width:100%;height:100%;display:block}
  @page{size:A4;margin:12mm}
}
@media (max-width:380px){ .brand{font-size:1.1em} .devchip{max-width:36vw;font-size:.72em} .stcard .thumb{flex-basis:84px;height:66px} .ctr{grid-template-columns:minmax(64px,1fr) 58px 48px 58px} }
.top > *{min-width:0}

.stl{display:none;color:var(--muted);margin-top:3px;line-height:1.35}
@media (max-width:640px){ .rtable .stc{display:none} .rtable .stl{display:block} }
#mExtra{display:flex;flex-direction:column;gap:8px;margin:10px 0;text-align:left}
#mExtra .chk{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:10px;font-size:1em}
#mExtra .chk input{width:24px;height:24px;flex:none}

#updBar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#14284b;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);font-weight:700}
#updBar span{flex:1}
#updBar button{min-height:40px;padding:6px 12px}

/* live sync */
.syncchip{min-height:36px;padding:3px 8px;margin-right:6px;font-size:.75em;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);white-space:nowrap}
.syncchip[data-st=connected]{border-color:#5fd38d}.syncchip[data-st=offline],.syncchip[data-st=connecting]{border-color:#f0c040}.syncchip[data-st=error]{border-color:#ff6b6b}
.syncqr svg{width:200px;height:200px;display:block;margin:8px auto;background:#fff}
.restable{border-collapse:collapse;font-size:13px;width:100%}
.restable th,.restable td{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;white-space:nowrap}
.resboard .msg{margin:6px 0}

/* score sheets (print only; the sheet layout itself is src/sheet.css, shared with archive.html) */
@media print{
  .printarea .sheet{break-after:page;page-break-after:always}
  .printarea .sheet:last-child{break-after:auto;page-break-after:auto}
}
/* RO roles card */
.rorow{border-top:1px solid var(--border);padding:8px 0}
.rostages{display:flex;flex-wrap:wrap;gap:6px}
.rostages .agree{margin:4px 0;padding:6px 10px;font-size:.95em}
.rostages .agree input{width:24px;height:24px}
.rocode{letter-spacing:.06em}
/* club-shoot results pack (print only, A4 landscape) */
@page pkland{size:A4 landscape;margin:9mm 10mm}
@media print{
  /* keep the navy headers, podium and row shading: browsers drop backgrounds in print unless told otherwise */
  .printarea .pkpage,.printarea .pkpage *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  .printarea .pkpage{page:pkland;break-after:page;position:relative;min-height:188mm;padding-bottom:9mm;font-family:"Barlow","Roboto",Arial,sans-serif;font-size:8.6pt;color:#111}
  .printarea .pkpage:last-child{break-after:auto}
  /* Spectre logo (print-logo.js): fills the gap between title and brand, takes no layout space, hidden when the gap is too small */

  .printarea .pklogo .splogo{position:absolute;top:-1.5mm;bottom:-1mm;right:5mm;height:calc(100% + 2.5mm);width:min(40mm,calc(100cqw - 10mm))}

  .printarea .pkpage.pkq{display:flex;flex-direction:column}

  .printarea .pkqsp{flex:1 1 0;min-height:0;position:relative;container-type:size}
  .printarea .pkqr{position:absolute;right:0;bottom:1mm;width:22mm;text-align:center;font-size:6.5pt;line-height:1.2;color:#333}
  .printarea .pkqr .spqr{display:block;width:22mm;height:22mm}
  @container (max-height:31mm){.printarea .pkqr{display:none}}
  .pkhead{display:flex;justify-content:space-between;align-items:flex-end;background:#14284b;color:#fff;padding:2.5mm 4mm 2mm;border-left:2.2mm solid #d6a92a;margin-bottom:3mm}
  .pkt{font-family:var(--cond);font-weight:900;font-size:16pt;text-transform:uppercase;letter-spacing:.02em}
  .pks{font-size:7.6pt;opacity:.9}

  .printarea table.pkinfo{border:0.8pt solid #14284b;margin-bottom:3mm;font-size:8pt}
  .printarea .pkinfo th{background:#e9edf3;font-weight:700;width:auto;white-space:nowrap}
  .printarea .pkinfo th,.printarea .pkinfo td{border:0.5pt solid #b7c0cf;padding:1mm 1.6mm}
  .pkpod{display:flex;gap:6mm;margin:0 0 3mm}
  .pp{flex:1;text-align:center;padding:1.5mm;border:0.8pt solid #999}

  .ppt{font-family:var(--cond);font-weight:900;font-size:13pt;color:#14284b}.ppn{font-weight:700;font-size:10pt}.ppx{font-size:7.5pt;color:#555}
  .pkh3{font-family:var(--cond);font-size:10.5pt;margin:2mm 0 1mm;color:#14284b;text-transform:none}
  .printarea table.pktab{font-size:8pt}

  .printarea .pktab td{text-align:center;border:0;border-bottom:0.4pt solid #d5dbe5;padding:0.9mm 1.2mm}
  .printarea .pktab .l{text-align:left}.printarea .pktab td.wrap{white-space:normal}
  .printarea .pktab tr:nth-child(even) td{background:#f4f6f9}
  .printarea .pktab tr.pl1 td{background:#f7e7b1}.printarea .pktab tr.pl3 td{background:#f3e0cc}
  .printarea .pktab tr.pkdnf td{background:#f7e7b1}
  .pktab .mul{font-weight:400;font-size:6.8pt;color:#d6a92a}
  .pkwhy{font-size:7pt;color:#555}
  .pkfn{font-size:7.4pt;margin-top:2mm;line-height:1.35}
  .pkul{margin:0 0 2mm;padding-left:5mm;font-size:8pt}
  .pkfoot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;border-top:0.8pt solid #d6a92a;padding-top:1mm;font-size:6.8pt;color:#555}
  .pkfoot span:first-child{font-style:italic}
}
@media print{
.sheet{font-size:10pt;color:#000;background:#fff}
.sheet h1{font-size:15pt;margin:0 0 1mm}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:0.6pt solid #000;padding:1mm 1.4mm;text-align:left;vertical-align:middle}
.sheet td.n{text-align:right}.sheet td.c{text-align:center}
.sheet .shhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5pt solid #000;padding-bottom:2mm;margin-bottom:3mm}
.sheet .shtag{font-family:var(--cond,"Arial Narrow",Arial,sans-serif);font-size:14pt;font-weight:900;text-transform:uppercase}
.sheet .shinfo th,.sheet .shtot th{width:18%;background:#eee}
.sheet .shinfo,.sheet .shst,.sheet .shtot{margin-bottom:3mm}
.sheet .shst{font-size:8.6pt}
.sheet .shst th{background:#eee;font-size:7.8pt;text-align:center}
.sheet .shst tr.shby td{border-top:0;font-size:7.6pt;color:#333;padding-top:0.4mm;padding-bottom:0.6mm}
.sheet .shst tr.shby td:first-child{border-top:0}
.sheet .muted{color:#666}
.sheet .shtot td{font-size:12pt}
.sheet .vis{border:1pt solid #000;padding:0 1.5mm;font-size:8pt;font-weight:700}
.sheet .esig{height:9mm;max-width:28mm;object-fit:contain}
.sheet .shnote{font-size:8pt;color:#333}

/* ---------------- stage import (Stage Designer files v1 … 1.0, match or single stage) ---------------- */
function readDesignerFile(txt){
  if(!String(txt || "").trim()) throw new Error("The file is empty.");
  var raw; try{ raw = JSON.parse(txt); }catch(e){ throw new Error("The file is not valid JSON."); }
  if(!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("This file is not a Spectre Stage Designer match or stage.");
  if(raw.app === SS_APP) throw new Error("This is a Spectre Scoring file (" + (raw.kind || "backup") + "). Use Import pack / Restore backup instead.");
  if(raw.app && raw.app !== APP_ID) throw new Error("This file is from a different app (" + raw.app + ").");
  if((+raw.version || 1) > SCHEMA) throw new Error("This file was made by a newer version of the Stage Designer.");
  if(raw.kind === "stage"){
    if(!raw.stage || typeof raw.stage !== "object" || Array.isArray(raw.stage)) throw new Error("This stage file has no stage in it.");
    var one = normalizeState({ version: raw.version, match: { name: (raw.from && raw.from.match) || "" }, stages: [raw.stage] }).stages[0];
    one.no = raw.from && +raw.from.stageNo || 0;
    return { kind: "stage", match: raw.from ? { name: raw.from.match || "", date: raw.from.date || "" } : null, stages: [one] };
  }
  if(!Array.isArray(raw.stages) || !raw.match) throw new Error("This file is not a Spectre Stage Designer match or stage (no stages found).");
  if(!raw.stages.length) throw new Error("This match file contains no stages.");
  var ns = normalizeState(raw);
  ns.stages.forEach(function(s, i){ s.no = i + 1; });
  return { kind: "match", match: ns.match, stages: ns.stages };
}
/* add / replace stages: a stage with the same id is replaced (re-exported after editing), others are added */
function addStages(res){
  var clash = modelClash(res.stages, true); if(clash) throw new Error(clash);
  var added = 0, replaced = 0, warn = [];
  res.stages.forEach(function(st){
    var old = stageById(st.id);
    if(old){
      var n = Object.keys(S.scores).filter(function(k){ return k.indexOf(st.id + "|") === 0; }).length;
      var oldT = old.items.filter(isTarget).map(function(t){ return t.id; }).sort().join(), newT = st.items.filter(isTarget).map(function(t){ return t.id; }).sort().join();
      if(n && oldT !== newT) warn.push("Stage " + old.no + " (" + st.title + ") has " + n + " score(s) and its targets changed – check those scores.");
      st.no = old.no; S.stages[S.stages.indexOf(old)] = st; replaced++;
    } else {
      if(!st.no || S.stages.some(function(s){ return s.no === st.no; })) st.no = S.stages.reduce(function(m, s){ return Math.max(m, s.no); }, 0) + 1;
      S.stages.push(st); added++;
    }
  });
  if(res.kind === "match" && res.match && (!S.stages.length || added === res.stages.length) && res.match.name){
    if(!S.shooters.length && !Object.keys(S.scores).length){ S.match.name = res.match.name; if(res.match.date) S.match.date = res.match.date; if(res.match.venue) S.match.venue = res.match.venue; }
  }
  renumber(); return { added: added, replaced: replaced, warn: warn };
}

/* ---------------- shooters: PractiScore / roster CSV ---------------- */
function parseCSV(txt){
  txt = String(txt || "").replace(/^\uFEFF/, "");
  var first = txt.split(/\r?\n/)[0] || "", delim = ",";
  [";", "\t"].forEach(function(d){ if(first.split(d).length > first.split(delim).length) delim = d; });
  var rows = [], row = [], f = "", q = false, i, c;
  for(i = 0; i < txt.length; i++){
    c = txt[i];
    if(q){ if(c === '"'){ if(txt[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && txt[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ""; }); });
}
var COLMAP = [

  ["member", /^(member ?(#|no\.?|number|id)?|mem ?(#|no)|uspsa( ?#| ?number)?|ipsc ?(#|no|number)|idpa ?(#|no|number)|sapsa ?(#|no|number)|swpc ?(member ?)?(#|no|number)|membership ?(#|no|number)?|member_number|memberno|id ?number)$/],
  ["d_handgun", /^(handgun|handgun ?division|hg)$/], ["pf_handgun", /^(handgun ?pf|hg ?pf|handgun ?power ?factor)$/],
  ["d_shotgun", /^(shotgun|shotgun ?division|sg)$/], ["d_rifle", /^(rifle|rifle ?division)$/], ["pf_rifle", /^(rifle ?pf|rifle ?power ?factor)$/],
  ["division", /^(division|firearm ?class ?\/ ?division|firearm ?class|class ?\/ ?division|division ?\/ ?class|firearm)$/],
  ["cls", /^(class|classification)$/],
  ["squad", /^(squad|squad ?(#|no|number)|relay)$/],
  ["cat", /^(category|categories|age|age ?category|age ?group|cat)$/],
  ["email", /^(e-?mail|e-?mail ?address)$/],
  ["visitor", /^(visitor|guest)$/],
  ["no", /^(no\.?|#|number|shooter ?(#|no)|comp ?#|competitor ?#)$/]

function mapHeader(h){
  var out = {}; h.forEach(function(name, i){ var k = String(name).trim().toLowerCase().replace(/\s+/g, " ");
    for(var j = 0; j < COLMAP.length; j++) if(COLMAP[j][1].test(k) && out[COLMAP[j][0]] === undefined){ out[COLMAP[j][0]] = i; break; } });
  return out;
}
/* "SSP", "ssp", "Standard Service Pistol" -> "SSP"; else "" */
function classCode(v){
  var s = String(v || "").trim(); if(!s) return ""; var u = s.toUpperCase();
  if(CLS[u]) return u;
  var m = u.match(/^([A-Z]{2,3})\b/); if(m && CLS[m[1]]) return m[1];
  var hit = CLASSES.filter(function(c){ return c.n.toLowerCase() === s.toLowerCase(); })[0];
  return hit ? hit.c : "";
}
function readShootersCSV(txt){
  var rows = parseCSV(txt); if(rows.length < 2) throw new Error("The CSV has no shooter rows.");
  var hi = 0; for(var r = 0; r < Math.min(rows.length, 5); r++){ var m0 = mapHeader(rows[r]); if((m0.first !== undefined && m0.last !== undefined) || m0.full !== undefined){ hi = r; break; } }
  var m = mapHeader(rows[hi]);
  if(!((m.first !== undefined && m.last !== undefined) || m.full !== undefined)) throw new Error("No name columns found. The CSV needs First Name and Last Name (or Name) columns.");
  var out = [];
  rows.slice(hi + 1).forEach(function(row){
    var g = function(k){ return m[k] === undefined ? "" : String(row[m[k]] == null ? "" : row[m[k]]).trim(); };
    var first = g("first"), last = g("last");
    if(!first && !last && g("full")){ var p = g("full").split(/\s+/); if(/,/.test(g("full"))){ var q = g("full").split(","); last = q[0].trim(); first = q.slice(1).join(",").trim(); } else { first = p[0]; last = p.slice(1).join(" "); } }
    if(!first && !last) return;
    var divs = {}; ["handgun","shotgun","rifle"].forEach(function(k){ var v = g("d_" + k); if(!v) return; var c = classCode(v); divs[k] = { c: c, t: c ? "" : v }; if(k !== "shotgun") divs[k].pf = /major/i.test(g("pf_" + k)) ? "major" : "minor"; });
    var dk = Object.keys(divs)[0];
    var div = g("division") || (dk ? (divs[dk].c || divs[dk].t) : ""), cl = g("cls"), code = classCode(div) || classCode(cl);
    out.push({ divs: dk ? divs : undefined, first: first, last: last, member: g("member"), cls: code, clsText: code ? "" : (div || ""), squad: g("squad"), cat: g("cat"), email: g("email"), visitor: m.visitor === undefined ? undefined : /^(y|yes|true|1|x)$/i.test(g("visitor")), no: parseInt(g("no"), 10) || null });
  });

  return out;
}
function sameShooter(a, b){
  if(a.member && b.member) return a.member.toLowerCase() === b.member.toLowerCase();
  return (a.first + " " + a.last).trim().toLowerCase() === (b.first + " " + b.last).trim().toLowerCase();
}
function addShooters(list){
  var added = 0, updated = 0;
  list.forEach(function(n){
    var ex = S.shooters.filter(function(s){ return sameShooter(s, n); })[0];
    if(ex){ ["member","cls","clsText","squad","cat","email"].forEach(function(k){ if(n[k]) ex[k] = n[k]; }); if(n.visitor != null) ex.visitor = !!n.visitor; if(n.divs) ex.divs = n.divs; if(n.no) ex.no = n.no; updated++; }
    else { n.id = sid(); if(!n.no) n.no = S.shooters.reduce(function(mx, s){ return Math.max(mx, s.no || 0); }, 0) + 1; S.shooters.push(n); added++; }
  });
  return { added: added, updated: updated };
}
function clsLabel(sh){ return sh.cls || sh.clsText || "Unclassified"; }
/* ---- disciplines: a shooter may carry one division per discipline (registration) in sh.divs = { handgun|shotgun|rifle: { c: code, t: text, pf: "minor"|"major" } }.
   Stage firearms map onto disciplines: handgun → handgun, shotgun → shotgun, rifle / PCC / precision rifle → rifle.
   Shooters without divs (CSV import, manual entry, older matches) use their single cls for every discipline, as before. */
var DISCS = ["handgun", "shotgun", "rifle"], DISC_N = { handgun: "Handgun", shotgun: "Shotgun", rifle: "Rifle" }, DISC_PF = { handgun: true, rifle: true };
function discOf(fa){ return fa === "handgun" || fa === "shotgun" ? fa : fa ? "rifle" : ""; }
function discOfCls(code){ var c = CLS[code]; if(!c) return ""; return c.g === "pistol" || c.g === "revolver" ? "handgun" : c.g === "shotgun" ? "shotgun" : "rifle"; }
function hasDivs(sh){ return !!(sh.divs && Object.keys(sh.divs).length); }
function shDiv(sh, fa){ if(!hasDivs(sh) || !fa) return null; return sh.divs[discOf(fa)] || null; }
/* division label for a firearm's stages; null = shooter not entered in that discipline */
function divLabelFor(sh, fa){ if(!hasDivs(sh) || !fa) return clsLabel(sh); var d = shDiv(sh, fa); return d ? (d.c || d.t || "Unclassified") : null; }
function pfFor(sh, fa){ var d = shDiv(sh, fa); return d ? (DISC_PF[discOf(fa)] ? d.pf || "minor" : "") : (sh.pf || ""); }
function enteredFor(sh, fa){ return !fa || !hasDivs(sh) || !!shDiv(sh, fa); }
function divsText(sh){ if(!hasDivs(sh)) return clsLabel(sh) + (sh.pf ? " " + sh.pf : "");
  return DISCS.filter(function(k){ return sh.divs[k]; }).map(function(k){ var d = sh.divs[k]; return FIREARMS[k].short + " " + (d.c || d.t || "?") + (DISC_PF[k] && d.pf ? " " + d.pf : ""); }).join(" · "); }
/* squad order: squad (numeric aware), then shooter number, then name */
function squadSorted(list){
  return list.slice().sort(function(a, b){
    var c = String(a.squad || "~").localeCompare(String(b.squad || "~"), undefined, { numeric: true }); if(c) return c;
    if((a.no || 9999) !== (b.no || 9999)) return (a.no || 9999) - (b.no || 9999);
    return shName(a).localeCompare(shName(b));

/* ---------------- scoring: what each target needs ---------------- */
function stageModel(st){ return st.scoring === "lr" ? "lr" : st.scoring === "qs" ? "qs" : st.scoring === "positive" ? "positive" : "negative"; }
function stageTargets(st){ return st.items.filter(function(t){ return isTarget(t) && !isNoShoot(t); }); }
/* entry kind for a target: fall | lr | moz | zones */
function targetSpec(st, t){
  var r = reqOf(st, t), model = stageModel(st), zt = ZONES[t.type];
  var spec = { t: t, req: r, label: t.label || TYPES[t.type].n, type: TYPES[t.type].n, scored: r.scored == null ? 2 : r.scored, cap: null, kind: "zones", unit: "hits" };
  if(model === "lr" && isSteel(t)){ spec.kind = "lr"; spec.maxShots = 2; return spec; }
  if(r.mode === "fall"){ spec.kind = "fall"; spec.scored = 1; return spec; }
  if(r.mode === "moz"){ spec.kind = "moz"; spec.scored = 3; spec.cap = 2; spec.headCap = 1; }
  if(isSteel(t)) spec.zones = [["hz", "HZ"], ["pz1", "PZ"]];
  else spec.zones = [["hz", "HZ" + (zt && !zt.perQual ? " (" + zt.hz.replace("down-", "−") + ")" : "")], ["pz1", "PZI" + (zt && !zt.perQual ? " (" + zt.pz1.replace("down-", "−") + ")" : "")], ["pz2", "PZII" + (zt && !zt.perQual ? " (" + zt.pz2.replace("down-", "−") + ")" : "")]];
  if(r.mode === "buck"){ spec.unit = "pairs"; spec.cap = 2; }
  else if(r.mode === "fixed" || r.mode === "all" || r.mode === "sg") spec.cap = r.mode === "sg" && r.need == null && !st.limited ? null : spec.scored;
  else if(r.mode === "best2"){ spec.cap = st.limited && r.rounds && r.rounds.fixed && r.rounds.any ? Math.max(2, r.rounds.rounds) : null; }
  else if(r.mode === "custom" && r.n != null){ spec.cap = st.limited && r.rounds && r.rounds.fixed && r.rounds.any ? Math.max(spec.scored, r.rounds.rounds) : null; }
  /* no hard cap (unlimited stage, best-N counted): warn when more hits are entered than can ever be fired-and-counted sensibly */
  if(spec.cap == null && r.mode !== "best2" && spec.scored != null) spec.soft = spec.scored;
  if(isQual(t.type)) spec.qual = true;
  return spec;
}
function penaltyList(st){
  var p = st.penalties || {}, out = [];
  out.push({ k: "proc", n: "Procedural", on: !!p.procedural, v: 3, ref: "§4.4.2" });
  out.push({ k: "tac", n: "Tactical / fieldcraft", on: !!p.tactical, v: 3, ref: "§4.4.3" });
  if(p.other && String(p.other).trim()) out.push({ k: "other", n: "Other: " + String(p.other).trim(), on: true, v: 3, ref: "briefed" });
  return out;
}
function coverOn(st){ var m = stageModel(st); return (m === "negative" || m === "positive") && (st.division === "CQ" || !!st.cover); }
/* no-shoot / hostage hits are always penalised (MD ruling), even when not ticked in the brief */
function nsOn(st){ return true; }

/* ---- one scoring model per match (MD ruling). Long-Range and QS stages have their own methods and may sit alongside. ---- */
function mainModels(stages){ var u = {}; stages.forEach(function(st){ var m = stageModel(st); if(m === "negative" || m === "positive") u[m] = 1; }); return Object.keys(u); }

/* returns an error message when the stages would mix negative and positive scoring, else null */
function modelClash(incoming, replacing){
  var keep = S.stages.filter(function(s){ return !replacing || !incoming.some(function(n){ return n.id === s.id; }); });
  var inc = mainModels(incoming), have = mainModels(keep);
  if(inc.length > 1) return "This file mixes negative and positive scoring stages (" + incoming.filter(function(s){ return stageModel(s) === "positive"; }).map(function(s){ return s.title; }).join(", ") + " are positive). A match uses one scoring model – fix the stages in the Stage Designer first.";
  if(inc.length && have.length && inc[0] !== have[0]) return "This match uses " + have[0] + " scoring, but the file’s stage(s) use " + inc[0] + " scoring. A match uses one scoring model only.";

/* blank score for a shooter on a stage */
function newScore(st, sh){
  var sc = { key: skey(st.id, sh.id), stage: st.id, shooter: sh.id, time: null, targets: {}, ns: {}, pens: {}, cover: { imp: 0, good: 0 },
    dnf: false, dq: false, dqReason: "", qs: { pts: null, pass: null }, signed: false, sig: false, device: S.device.name, deviceId: S.device.id, at: null, rev: 0, history: [] };
  stageTargets(st).forEach(function(t){ sc.targets[t.id] = { hz: 0, pz1: 0, pz2: 0, hhz: 0, hpz: 0, down: false, fte: false, hit: false, shots: 0 }; });

}
function tgt(sc, id){ var o = sc.targets[id]; if(!o){ o = sc.targets[id] = { hz: 0, pz1: 0, pz2: 0, hhz: 0, hpz: 0, down: false, fte: false, hit: false, shots: 0 }; } return o; }

/* ---- the maths: §4.2.2 zone values, §4.2.4 completion formulas, §4.4 penalties, §4.2.3 cover ----
   counted hits per target = the best `scored` hits (HZ first, then PZI, then PZII); misses = scored − counted.
   Failure to engage = as many misses as the target's required hits (MD ruling: 1-hit steel/slug 1, best 2 = 2, Mozambique 3, fixed N = N, buckshot 2). */

  if(!Array.isArray(p.stages) || !Array.isArray(p.shooters)) throw new Error("This stage pack is damaged (no stages or shooters).");
  var other = S.matchId !== p.matchId, hasScores = Object.keys(S.scores).length > 0;
  if(other && hasScores && !force) return { needConfirm: "This phone holds " + Object.keys(S.scores).length + " score(s) for another match (" + S.match.name + "). Replace them with the new match? Export a backup first if unsure." };
  if(S.role === "main" && !other && S.stages.length && !force) return { needConfirm: "This phone is the main phone for this match. Turn it into an RO phone for stage(s) " + p.stages.map(function(s){ return s.no; }).join(", ") + "?" };
  var dev = S.device;
  if(other){ S = blankState(); S.device = dev; UNDO = []; saveUndo(); }
  S.matchId = p.matchId; S.match = p.match; S.role = "ro";
  p.stages.forEach(function(st){ var n = normalizeStage(st); n.no = st.no; var ex = stageById(n.id); if(ex) S.stages[S.stages.indexOf(ex)] = n; else S.stages.push(n); });
  renumber();
  p.shooters.forEach(function(sh){ var ex = shooterById(sh.id); if(ex) Object.assign(ex, sh); else S.shooters.push(clone(sh)); });
  S.ro = { assigned: p.assigned || p.stages.map(function(s){ return s.id; }), main: p.from ? p.from.name : "", packId: p.packId, at: nowISO() };
  if(!S.device.name && p.forDevice) S.device.name = p.forDevice;
  saveState(); return { ok: true, stages: p.stages.length, shooters: p.shooters.length };
}
/* main phone merges a scores pack: new scores are added, identical ones skipped, different ones become conflicts */
function mergeScoresPack(p, opts){
  if(S.role === "ro") throw new Error("This is an RO phone. Scores packs are merged on the main phone.");
  if(p.matchId !== S.matchId) throw new Error("This scores pack is for a different match (" + (p.match && p.match.name || "?") + ").");
  if(!Array.isArray(p.scores)) throw new Error("This scores pack is damaged (no scores).");
  var r = { added: 0, same: 0, conflicts: 0, unknown: 0, from: p.from ? p.from.name : "?" }, sigJobs = [];
  p.scores.forEach(function(inc){
    if(!stageById(inc.stage) || !shooterById(inc.shooter)){ r.unknown++; return; }
    var loc = S.scores[inc.key];
    if(p.sigs && p.sigs[inc.key + "#" + inc.rev]) sigJobs.push(sigPut(inc.key + "#" + inc.rev, p.sigs[inc.key + "#" + inc.rev]));
    if(!loc){ var c = clone(inc); c.mergedFrom = r.from; S.scores[inc.key] = c; r.added++; return; }
    if(sameScore(loc, inc)){ r.same++; return; }
    var dup = S.conflicts.filter(function(x){ return x.key === inc.key && sameScore(x.incoming, inc); })[0];
    if(dup){ r.conflicts++; return; }
    S.conflicts.push({ id: sid(), key: inc.key, local: clone(loc), incoming: clone(inc), from: r.from, at: nowISO() }); r.conflicts++;
  });
  if(!(opts && opts.live) || r.added || r.conflicts) S.merged.push({ at: nowISO(), from: r.from + (opts && opts.live ? " (live)" : ""), packId: p.packId, added: r.added, same: r.same, conflicts: r.conflicts });
  saveState(); return Promise.all(sigJobs).then(function(){ return r; });
}
function resolveConflict(id, take){
  var c = S.conflicts.filter(function(x){ return x.id === id; })[0]; if(!c) return;
  var cur = S.scores[c.key];
  if(take === "incoming"){
    var n = clone(c.incoming); n.history = (n.history || []).concat([{ at: nowISO(), device: S.device.name, note: "Merge conflict: kept " + c.from + "’s score over main’s", prev: (function(){ var p = clone(cur || c.local); delete p.history; return p; })() }]);
    UNDO.push({ key: c.key, before: cur || null, after: n, at: nowISO() }); saveUndo();
    S.scores[c.key] = n;
  }
  S.audit.push({ at: nowISO(), device: S.device.name, key: c.key, note: "Merge conflict with " + c.from + ": kept " + (take === "incoming" ? c.from + "’s" : "main’s") + " score", from: scoreSummary(c.local), to: scoreSummary(take === "incoming" ? c.incoming : c.local) });
  S.conflicts = S.conflicts.filter(function(x){ return x.id !== id; }); saveState();
}
function restoreBackup(b){
  if(!b.state || b.state.app !== SS_APP) throw new Error("This backup is damaged.");
  var dev = S.device; S = fixState(clone(b.state));
  if(b.keepDevice !== false) S.device = dev.name ? dev : S.device;
  UNDO = b.undo || []; saveUndo(); saveState();
  var jobs = Object.keys(b.sigs || {}).map(function(k){ return sigPut(k, b.sigs[k]); });
  return Promise.all(jobs);
}

/* ===================== RO roles + digital "Scored by" =====================

function rolesMap(){ var m = {}; (S.ros || []).forEach(function(r){ if(r.name) m[r.id] = { n: String(r.name).slice(0, 60), s: (r.stages || []).filter(function(id){ return !!stageById(id); }).slice(0, 40) }; }); return m; }

function roParseCode(txt){ var m = /^\s*([A-Za-z0-9]{6,8})\s*[-– ]\s*([A-Za-z0-9]{4})\s*$/.exec(String(txt || "")); return m ? { code: m[1].toUpperCase(), ro: m[2].toUpperCase() } : null; }

/* ===================== per-shooter score sheets (print / PDF, one A4 page per shooter) ===================== */

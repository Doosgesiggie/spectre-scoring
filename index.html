<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectre Scoring – Version 1.0</title>
<meta name="description" content="Spectre Tactical Shooting match scoring – offline">
<meta name="theme-color" content="#14284b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spectre Scoring">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#f2f3f6; --card:#fff; --text:#000; --muted:#262a33; --border:#5d6576; --line:#c9cdd6;
  --navy:#14284b; --gold:#c9971f; --accent:#1f4f9f; --ok:#0f7a2e; --ok-bg:#dff3e4; --warn:#8a5200; --warn-bg:#fff1cc; --bad:#b0120e; --bad-bg:#fde3e1;
  --btn:#fff; --btn-text:#000; --chip:#e7eaf0;
  --cond:"Barlow Condensed",Bahnschrift,"Arial Narrow","Roboto Condensed",sans-serif;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
body.dark{ --bg:#06090f; --card:#121826; --text:#fff; --muted:#c3c9d6; --border:#8d97ab; --line:#2c3445; --btn:#1b2333; --btn-text:#fff; --chip:#222b3d;
  --accent:#7fb0ff; --ok:#5fe08a; --ok-bg:#0f2e1a; --warn:#ffc65c; --warn-bg:#33270a; --bad:#ff7b72; --bad-bg:#3a1210; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:calc(var(--tabh) + var(--safe-b))}
body.big{font-size:20px}
button{font:inherit;font-weight:600;min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--btn);color:var(--btn-text);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
body.dark button.primary{background:#2a5bd7;border-color:#2a5bd7}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
body.dark button.ok{color:#000}
button.danger{color:var(--bad);border-color:var(--bad)}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark button.on{background:#2a5bd7;border-color:#2a5bd7}
button:disabled{opacity:.4}
button.wide{width:100%}
button.slim{min-height:48px;padding:4px 10px;font-size:.9em}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-height:50px}
input[type=checkbox]{width:28px;height:28px;min-height:0;accent-color:var(--navy)}
label{display:block;font-size:max(14px,.85em);font-weight:600;color:var(--muted);margin:10px 0 4px}
h2{font-family:var(--cond);font-size:1.45em;margin:4px 0 10px;letter-spacing:.01em;text-transform:uppercase}
h3{font-family:var(--cond);font-size:1.15em;margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)} .small{font-size:.85em}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}
.brand{font-family:var(--cond);font-size:1.3em;font-weight:800;white-space:nowrap}
.brand b{color:var(--gold)} .brand .ver{font-size:.6em;opacity:.8;font-weight:500;margin-left:4px}
.devchip{min-height:48px;padding:3px 10px;font-size:.8em;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:12px;max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--border);padding-bottom:var(--safe-b)}
.tabs button{border:0;border-radius:0;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:max(13px,.8em);font-weight:700;background:transparent;color:var(--muted)}
.tabs button .ti{font-size:1.45em;line-height:1}
.tabs button.on{color:var(--text);background:var(--chip);box-shadow:inset 0 4px 0 var(--gold)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1 1 auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:max(13px,.78em);font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.msg{border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:600;font-size:.9em}
.msg.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok)} .msg.info{background:var(--chip)}
/* stage cards */
.stcard{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:8px;min-height:96px;border-radius:14px;margin:0 0 10px;background:var(--card)}
.stcard .thumb{flex:0 0 110px;height:80px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden}
.stcard .thumb svg{width:100%;height:100%}
.stcard .info{flex:1;min-width:0}
.stcard .tt{font-family:var(--cond);font-size:1.2em;font-weight:800;line-height:1.1}
.prog{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
/* shooter list */
.shrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:60px;margin:0 0 8px;background:var(--card)}
.shrow .nm{flex:1;min-width:0}.shrow .nm b{display:block;font-size:1.05em}
.shrow.done{border-color:var(--ok)} .shrow.next{border-width:3px;border-color:var(--gold)}
.shrow .sc{font-weight:800;white-space:nowrap}
.nextbar{position:sticky;bottom:calc(var(--tabh) + var(--safe-b) + 6px);z-index:5;margin-top:8px}
.nextbar button{width:100%;min-height:62px;font-size:1.1em;box-shadow:0 4px 16px rgba(0,0,0,.25)}
/* scoring entry */
.ehead{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);margin:-12px -12px 10px;padding:8px 12px;border-bottom:2px solid var(--line)}
.ehead .who{font-size:1.2em;font-weight:800;line-height:1.15}
.timebox input{font-size:2em;font-weight:800;text-align:center;letter-spacing:.02em;min-height:70px;font-variant-numeric:tabular-nums}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px}
.tcard.err{border-color:var(--bad)} .tcard.done{border-color:var(--ok)}
.tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.tcard .th b{font-size:1.15em}
.ctr{display:grid;grid-template-columns:minmax(78px,1fr) 64px 58px 64px;align-items:center;gap:6px;margin:5px 0}
.ctr .lab{font-weight:700}
.ctr button{min-height:56px;font-size:1.6em;padding:0;line-height:1}
.ctr .val{text-align:center;font-size:1.6em;font-weight:800;font-variant-numeric:tabular-nums}
.ctr.auto .val{color:var(--bad)} .ctr.auto .lab small{font-weight:500;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:5px 0}
.seg button{min-height:58px}
.fte{margin-top:6px;min-height:48px;width:100%;font-size:.9em}
.fte.on{background:var(--bad);border-color:var(--bad);color:#fff}
.livebar{position:sticky;bottom:calc(var(--tabh) + var(--safe-b));z-index:12;margin:12px -12px -12px;padding:8px 12px calc(8px);background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center}
body.entry .livebar{bottom:0} body.entry{padding-bottom:0} body.entry .tabs{display:none}
.livebar .live{flex:1;min-width:0}.livebar .live b{display:block;font-size:1.7em;line-height:1.05;font-variant-numeric:tabular-nums}
.livebar button{min-height:60px;font-size:1.1em;background:var(--gold);border-color:var(--gold);color:#000;padding:8px 18px}
.breakdown{font-size:.9em;margin:4px 0 0;padding-left:18px}
.sigpad{width:100%;height:170px;background:#fff;border:2px dashed var(--border);border-radius:12px;touch-action:none;display:block}
.agree{display:flex;align-items:center;gap:12px;font-size:1.1em;font-weight:700;padding:10px;border:3px solid var(--border);border-radius:12px;background:var(--card);margin:10px 0;cursor:pointer}
.agree input{width:34px;height:34px}
.agree.on{border-color:var(--ok);background:var(--ok-bg)}
/* results */
.restabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.restabs button{flex:0 0 auto;min-height:48px}
.rtable{width:100%;border-collapse:collapse;font-size:.88em;background:var(--card)}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
.rtable th{font-size:max(13px,.8em);text-transform:uppercase;color:var(--muted)}
.rtable td.n,.rtable th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable .pl{font-weight:800;font-size:1.1em;width:32px}
.rtable tr.un td{color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:2px solid var(--line)}
/* merge */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp > div{border:2px solid var(--line);border-radius:10px;padding:8px;font-size:.88em}
.cmp .tot{font-size:1.35em;font-weight:800}
/* overlays */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal[hidden],.overlay[hidden]{display:none}
.mbox{background:var(--card);color:var(--text);border-radius:16px;padding:16px;width:100%;max-width:520px;margin-bottom:var(--safe-b);max-height:85vh;overflow:auto}
#mBody{white-space:pre-wrap;font-size:1.02em;margin-bottom:10px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.overlay{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + var(--safe-b))}
.qrbox{background:#fff;padding:8px;border-radius:12px;max-width:min(92vw,62vh);margin:8px auto}
.qrbox svg{width:100%;height:auto;display:block}
.scanv{width:100%;max-height:55vh;background:#000;border-radius:12px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe-b) + 14px);z-index:120;background:#111;color:#fff;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:600;display:none;align-items:center;gap:12px;max-width:94vw;min-height:48px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.show{display:flex}
.toast button{min-height:48px;min-width:72px;background:var(--gold);color:#000;border-color:var(--gold)}
body.entry .toast{bottom:100px}
.offline{display:none}
.diag{background:#fff;border-radius:10px;border:1px solid var(--line);margin:6px 0;height:220px}.diag svg{width:100%;height:100%}
details > summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center}
.list-plain{list-style:none;margin:0;padding:0}.list-plain li{padding:8px 0;border-bottom:1px solid var(--line)}
@media (min-width:600px){ .grid2.w3{grid-template-columns:1fr 1fr 1fr} }
@media (max-width:380px){ .brand{font-size:1.1em} .devchip{max-width:36vw;font-size:13px} .stcard .thumb{flex-basis:84px;height:66px} .ctr{grid-template-columns:minmax(64px,1fr) 58px 48px 58px} }
.top > *{min-width:0}

.stl{display:none;color:var(--muted);margin-top:3px;line-height:1.35}
@media (max-width:640px){ .rtable .stc{display:none} .rtable .stl{display:block} }
#mExtra{display:flex;flex-direction:column;gap:8px;margin:10px 0;text-align:left}
#mExtra .chk{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:10px;font-size:1em}
#mExtra .chk input{width:24px;height:24px;flex:none}

#updBar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#14284b;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);font-weight:700}
#updBar span{flex:1}
#updBar button{min-height:48px;padding:6px 12px}

/* live sync */
.syncchip{min-height:48px;padding:3px 8px;margin-right:6px;font-size:.75em;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);white-space:nowrap}
.syncchip[data-st=connected]{border-color:#5fd38d}.syncchip[data-st=offline],.syncchip[data-st=connecting]{border-color:#f0c040}.syncchip[data-st=error]{border-color:#ff6b6b}
.syncqr svg{width:200px;height:200px;display:block;margin:8px auto;background:#fff}
.restable{border-collapse:collapse;font-size:13px;width:100%}
.restable th,.restable td{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;white-space:nowrap}
.resboard .msg{margin:6px 0}

/* RO roles card */
.rorow{border-top:1px solid var(--border);padding:8px 0}
.rostages{display:flex;flex-wrap:wrap;gap:6px}
.rostages .agree{margin:4px 0;padding:6px 10px;font-size:.95em}
.rostages .agree input{width:24px;height:24px}
.rocode{letter-spacing:.06em}


/* DNF / DQ kept apart on the entry screen */
.endrow{margin:14px 0 10px}
.dqsep{display:flex;align-items:center;gap:10px;margin:26px 0 8px;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dqsep::before,.dqsep::after{content:"";flex:1;border-top:2px dashed var(--line)}
/* persistent offline / waiting indicator */
.offpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:110;background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);border-radius:999px;padding:6px 16px;min-height:48px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap;display:none}
.offpill.show{display:block}
/* low-risk: keep the header readable on phones when the sync chip is showing; toast wide enough not to wrap the name */
.toast{width:max-content;max-width:calc(100vw - 24px)}
@media (max-width:480px){ .brand .ver{display:none} .syncchip{max-width:34vw;overflow:hidden;text-overflow:ellipsis} }
.badge{display:inline-block;font-size:.72em;font-weight:700;padding:1px 6px;border-radius:6px;vertical-align:middle} .badge.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>SPECTRE</b> Scoring <span class="ver">Version 1.0</span></div>
  <button class="devchip" id="devChip" type="button" title="This phone"></button>
</header>
<div id="offline" class="offline" hidden>Offline ready</div>
<main id="view" class="view"></main>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="score"><span class="ti">🎯</span>Score</button>
  <button type="button" data-tab="results"><span class="ti">🏆</span>Results</button>
  <button type="button" data-tab="shooters"><span class="ti">👥</span>Shooters</button>
  <button type="button" data-tab="match"><span class="ti">⚙</span>Match</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mBody"></div><input id="mInput" hidden><div class="mbtns"><button type="button" id="mCancel">Cancel</button><button type="button" class="primary" id="mOk">OK</button></div></div></div>
<div id="overlay" class="overlay" hidden></div>
<input type="file" id="fileAny" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>

    var prev = clone(old); delete prev.history;

    c.rev = (old.rev || 1) + 1;
    S.audit.push({ at: c.at, device: S.device.name, key: c.key, note: String(note).trim(), from: scoreSummary(old), to: scoreSummary(c) });
  } else { c.rev = 1; c.history = []; }

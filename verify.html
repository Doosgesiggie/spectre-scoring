:root{--navy:#14284b;--gold:#c59a1e;--border:#c9d2e0;--muted:#5a6475;--cond:"Arial Narrow","Roboto Condensed",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef1f6;color:#111;font-size:16px}
header{background:var(--navy);color:#fff;padding:12px 16px;border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:1.2em;font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em}
main{max-width:980px;margin:0 auto;padding:12px}
.badge{background:#e8f4ea;border:1.5px solid #2e7d32;color:#1b5e20;border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:600}
.badge.bad{background:#fdecea;border-color:#a3271f;color:#7f1d17}
.badge small{display:block;font-weight:400;color:#333;margin-top:2px}
.paper{background:#fff;width:210mm;max-width:100%;padding:10mm;margin:10px auto;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow-x:auto}
.rp{width:297mm}.rp h2{margin:0 0 2px;font-family:var(--cond);color:var(--navy);text-transform:uppercase}.rp h3{margin:14px 0 2px;font-family:var(--cond);color:var(--navy)}.rmeta{margin:0 0 4px;color:var(--muted);font-size:.85em}
.att{border-collapse:collapse;width:100%;font-size:.85em}.att th{background:var(--navy);color:#fff;text-align:left;padding:4px 6px}.att td{border-bottom:1px solid var(--border);padding:4px 6px}.att tr:nth-child(even) td{background:#f4f6f9}
.rtw{overflow-x:auto}.rt{border-collapse:collapse;width:100%;font-size:.8em}.rt th{background:var(--navy);color:#fff;padding:3px 5px;text-align:left}.rt td{border-bottom:1px solid var(--border);padding:2px 5px}.rt tr:nth-child(even) td{background:#f4f6f9}
@media print{.rt{font-size:7.5pt}.rp h3{break-after:avoid}.rt tr{break-inside:avoid}}
.sheet{font-size:10pt;color:#000;background:#fff}
.sheet h1{font-size:15pt;margin:0 0 1mm}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:0.6pt solid #000;padding:1mm 1.4mm;text-align:left;vertical-align:middle}
.sheet td.n{text-align:right}.sheet td.c{text-align:center}
.sheet .shhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5pt solid #000;padding-bottom:2mm;margin-bottom:3mm}
.sheet .shtag{font-family:var(--cond,"Arial Narrow",Arial,sans-serif);font-size:14pt;font-weight:900;text-transform:uppercase}
.sheet .shinfo th,.sheet .shtot th{width:18%;background:#eee}
.sheet .shinfo,.sheet .shst,.sheet .shtot{margin-bottom:3mm}
.sheet .shst{font-size:8.6pt}
.sheet .shst th{background:#eee;font-size:7.8pt;text-align:center}
.sheet .shst tr.shby td{border-top:0;font-size:7.6pt;color:#333;padding-top:0.4mm;padding-bottom:0.6mm}
.sheet .shst tr.shby td:first-child{border-top:0}
.sheet .muted{color:#666}
.sheet .shtot td{font-size:12pt}
.sheet .vis{border:1pt solid #000;padding:0 1.5mm;font-size:8pt;font-weight:700}
.sheet .esig{height:9mm;max-width:28mm;object-fit:contain}
.sheet .shnote{font-size:8pt;color:#333}
.sheet .shfoot{margin-top:6mm;font-size:7.5pt;color:#555}
.sheet sup.fn{font-size:6.5pt;font-weight:700;margin-left:0.6mm}
.sheet .shfn{margin:0 0 2mm;padding-left:5mm;font-size:8pt}
.sheet .shmnote{font-size:8.5pt;margin:0 0 2mm;padding:1.2mm 2mm;border:0.6pt solid #000;white-space:pre-wrap}
.sheet .shhead{position:relative}
.sheet .shlogo{flex:1 1 0;min-width:0;align-self:stretch;position:relative;container-type:inline-size;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .shlogo .splogo{position:absolute;top:0;bottom:0;right:5mm;height:100%;width:min(40mm,calc(100cqw - 10mm))}
@container (max-width:28mm){.sheet .shlogo .splogo{display:none}}
.sheet .shfoot{position:relative}
.sheet .shqr{position:absolute;right:0;top:4mm;width:22mm;text-align:center;font-size:6.5pt;line-height:1.2;color:#333;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .shqr .spqr{display:block;width:22mm;height:22mm}

function spQRRuns(m){ var out = []; m.forEach(function(row, r){ for(var c = 0; c < row.length; c++){ if(!row[c]) continue; var s = c; while(c < row.length && row[c]) c++; out.push([r, s, c - s]); } }); return out; }

  return '<svg class="spqr" viewBox="0 0 ' + (n + 2 * q) + ' ' + (n + 2 * q) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="' + spQRRuns(m).map(function(x){ return "M" + (x[1] + q) + " " + (x[0] + q) + "h" + x[2] + "v1h-" + x[2] + "z"; }).join("") + '"/></svg>'; }
/* hangs below the sheet footer (absolutely positioned: takes no layout space) */
function spVerifyBlock(tok){ if(!spTokOk(tok)) return ""; var s = spQRSVG(spVerifyURL(tok)); return s ? '<div class="shqr">' + s + '<div class="shqrc">Verify this score sheet here</div></div>' : ""; }
/* jsPDF: QR as filled rects at (x, y), size w, with the caption underneath */
function spQRPdf(doc, tok, x, y, w){ if(!spTokOk(tok)) return false; var m = spQRMods(spVerifyURL(tok)); if(!m) return false; var n = m.length, k = w / n;
  doc.setFillColor(255, 255, 255); doc.rect(x - 2 * k, y - 2 * k, w + 4 * k, w + 4 * k, "F"); doc.setFillColor(0, 0, 0);
  spQRRuns(m).forEach(function(r){ doc.rect(x + r[1] * k, y + r[0] * k, r[2] * k + 0.05, k + 0.05, "F"); }); return true; }
/* ---------- match-level "Verify these results here" QR on the printable results packs ---------- */
/* HTML packs: a filler under the page content (flex column, takes only the page's left-over height) with the QR at its bottom
   right; a size container query hides it when the left-over space is too small. Nothing above it moves. */
function spResultsQR(tok){ if(!spTokOk(tok)) return ""; var s = spQRSVG(spVerifyURL(tok)); return s ? '<div class="pkqsp"><div class="pkqr">' + s + '<div class="pkqrc">Verify these results here</div></div></div>' : ""; }
/* jsPDF packs: ends[p] = y of the last thing drawn on page p. QR goes on the last page, else page 1, only into empty space above the footer. */
function spQRPdfPlace(doc, tok, ends, R, BOT, cap){ if(!spTokOk(tok)) return 0; var n = doc.getNumberOfPages(), lim = BOT - 80, p = 0;
  if(ends[n] != null && ends[n] < lim) p = n; else if(ends[1] != null && ends[1] < lim) p = 1;
  if(!p) return 0; doc.setPage(p); var ok = spQRPdf(doc, tok, R - 58, BOT - 72, 56); if(ok) cap(p); doc.setPage(n); return ok ? p : 0; }

/* ===================== Shooter attendance record (one page) =====================
   Built ONLY from publisher-written results copies (verify/{rt} docs, kind "results") and the admin-linked users/{uid}.shooterName.
   The public attendance verify doc stores just { kind, name, rts[] }: verify.html re-reads each public results copy and re-derives
   every row, so a shooter cannot type in placings. No IDs, cell numbers or e-mail addresses are read, stored or printed. */
function atNorm(s){ return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function atCol(h, re){ for(var i = 0; i < h.length; i++) if(re.test(h[i] || "")) return i; return -1; }
/* one results copy -> this shooter's row, or null if they did not shoot */
function atRow(name, d){
  var n = atNorm(name), mt = d.match || {}, T = d.tables || [], o = T[0]; if(!o) return null;
  var ci = atCol(o.h, /^shooter$/i), ri = atCol(o.h, /^(#|rank)$/i); if(ci < 0) return null;
  var me = (o.r || []).filter(function(r){ return atNorm(r[ci]) === n; })[0]; if(!me) return null;
  var pi = -1; for(var i = o.h.length - 1; i >= 0; i--) if(/points|total/i.test(o.h[i] || "") && !/\(/.test(o.h[i])){ pi = i; break; }
  var pts = pi >= 0 ? String(me[pi]) : "", ranked = (o.r || []).filter(function(r){ return /^\d+$/.test(String(r[ri])); }).length;
  var div = [];
  function cls(t){ var c = atCol(t.h || [], /^class$/i), s = atCol(t.h || [], /^shooter$/i); if(c < 0 || s < 0) return "";
    var r = (t.r || []).filter(function(x){ return atNorm(x[s]) === n; })[0]; return r ? String(r[c]) : ""; }
  T.forEach(function(t){ var lab = /^handgun results$/i.test(t.t) ? "HG " : /^long ?gun results$/i.test(t.t) ? "LG " : null; if(lab === null) return; var v = cls(t); if(v) div.push(lab + v); });
  if(!div.length){ var v0 = cls(o); div.push(v0 || "–"); }
  var place = /^\d+$/.test(String(me[ri])) ? me[ri] + " / " + ranked : String(me[ri] || "–");
  return { date: mt.date || "", match: mt.name || "", venue: mt.venue || "", div: div.join(" · ") || "–", place: place,
    pts: pts + (/^[\d.]+$/.test(pts) ? (/total/i.test(o.h[pi]) ? " s" : " pts") : ""), basis: o.t || "" };
}
function atRows(name, docs){ return docs.map(function(d){ return atRow(name, d); }).filter(Boolean).sort(function(a, b){ return a.date < b.date ? -1 : 1; }); }
var AT_CSS = '.atp{font-family:Barlow,"Segoe UI",Arial,sans-serif;color:#111;width:186mm;margin:0 auto}' +
  '.athd{display:flex;align-items:center;gap:6mm;background:#14284b;color:#fff;border-bottom:1.2mm solid #c59a1e;padding:4mm 5mm}.athd .splogo{height:15mm;width:44mm}' +
  '.athd h1{margin:0;font:800 17pt "Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.02em}.athd p{margin:1mm 0 0;font-size:9pt;color:#dfe5ef}' +
  '.atnm{font:700 20pt "Barlow Condensed",sans-serif;color:#14284b;margin:6mm 0 1mm}.atsub{color:#5a6475;font-size:9pt;margin:0 0 4mm}' +
  '.att{border-collapse:collapse;width:100%;font-size:9.5pt}.att th{background:#14284b;color:#fff;text-align:left;padding:1.6mm 2mm}.att td{border-bottom:.3mm solid #c9d2e0;padding:1.6mm 2mm}.att tr:nth-child(even) td{background:#f4f6f9}' +
  '.atft{display:flex;gap:5mm;align-items:center;margin-top:7mm;border-top:.4mm solid #c9d2e0;padding-top:4mm;font-size:8.5pt;color:#333}.atft .spqr{width:28mm;height:28mm;flex:none}.atft b{color:#14284b}';
function atTable(rows){ return '<table class="att"><thead><tr><th>Date</th><th>Match</th><th>Division</th><th>Placing</th><th>Points</th></tr></thead><tbody>' +
  rows.map(function(r){ return '<tr><td>' + shEsc(r.date) + '</td><td>' + shEsc(r.match) + (r.venue ? '<br><small>' + shEsc(r.venue) + '</small>' : "") + '</td><td>' + shEsc(r.div) + '</td><td>' + shEsc(r.place) + '</td><td>' + shEsc(r.pts) + '</td></tr>'; }).join("") + '</tbody></table>'; }
/* printable page; tok = the shooter's published attendance token, or "" when they chose not to publish (no QR then) */
function atPageHTML(name, rows, tok, made){
  var yrs = rows.map(function(r){ return r.date.slice(0, 4); }).filter(function(v, i, a){ return a.indexOf(v) === i; }).join(", ");
  return '<div class="atp"><div class="athd">' + spLogoSVG("navybar") + '<div><h1>Shooter attendance record</h1><p>Spectre Tactical Shooting · club shoots ' + shEsc(yrs) + '</p></div></div>' +
    '<div class="atnm">' + shEsc(name) + '</div><p class="atsub">' + rows.length + ' shoot' + (rows.length === 1 ? "" : "s") + ' attended · from the published Spectre results archive · generated ' + shEsc(made) + '</p>' + atTable(rows) +
    '<div class="atft">' + (tok ? spQRSVG(spVerifyURL(tok)) + '<div><b>Scan to verify.</b> The QR opens a public page that rebuilds this list from the published results, so it cannot be edited by hand.<br>' + shEsc(spVerifyURL(tok)) + '</div>'
      : '<div>Not published: this copy has no verify QR.</div>') + '</div></div>';
}
/* the public verify doc payload (the shooter's choice to publish): references only, no rows, no personal details */
function atVerifyDoc(name, rts, made){ return { v: 1, kind: "attendance", name: name, rts: rts, publishedAt: made }; }

/* ===================== score sheet renderer – shared by the app (print / PDF) and the public archive page =====================
   Input is a plain, JSON-safe sheet object (see sheetData in s-sheets.js), so the archive can draw the same layout from published data.
   d = { match:{name,date,venue,md,note}, neg, ver, sh:{name,no,member,squad,divs,cat,visitor}, rows:[{no,title,none,note}|{no,title,note,hz,pz1,pz2,miss,standing,pen,ns,time,penT,score,place,by,at,sigKey}], ov:{total,place,of,label}, method }
   sigs (optional) = { sigKey: dataURL } – the shooter's e-signature column appears only when at least one exists. */
function shEsc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function sheetByText(r){ return r && r.by ? "Scored by " + r.by + (r.at ? " · " + r.at : "") : ""; }
function sheetRender(d, sigs, printed){
  var e = shEsc, m = d.match || {}, sh = d.sh || {}, v = function(x){ return x == null || x === "" ? "" : e(x); };
  var sigOf = function(r){ return r && r.sigKey && sigs ? sigs[r.sigKey] : null; }, anySig = (d.rows || []).some(function(r){ return !!sigOf(r); });
  var h = '<div class="sheet"><div class="shhead"><div><h1>' + e(m.name) + '</h1><div>' + e(m.date) + (m.venue ? ' · ' + e(m.venue) : "") + (m.md ? ' · Match Director: ' + e(m.md) : "") + '</div></div>' + (typeof spLogoGap === "function" ? spLogoGap("shlogo", "onwhite") : "") + '<div class="shtag">Score sheet</div></div>';
  h += '<table class="shinfo"><tr><th>Shooter</th><td><b>' + e(sh.name) + '</b>' + (sh.visitor ? ' <span class="vis">VISITOR</span>' : "") + '</td><th>Shooter no.</th><td>' + v(sh.no) + '</td></tr>' +
    '<tr><th>Member no.</th><td>' + (sh.member ? e(sh.member) : sh.visitor ? "Visitor (not a club member)" : "") + '</td><th>Squad</th><td>' + v(sh.squad) + '</td></tr>' +
    '<tr><th>Division(s)</th><td colspan="3">' + e(sh.divs) + (sh.cat ? ' · Category: ' + e(sh.cat) : "") + '</td></tr></table>';
  var fns = [], fnOf = function(r){ if(!r || !r.note) return ""; fns.push({ no: r.no, text: r.note }); return '<sup class="fn">' + fns.length + '</sup>'; };
  var cols = 12 + (anySig ? 1 : 0);
  h += '<table class="shst"><tr><th>Stage</th><th>HZ</th><th>PZI</th><th>PZII</th><th>Miss</th><th>Steel standing</th><th>Proc. / pen.</th><th>No-shoot</th><th>Raw time</th><th>' + (d.neg ? "Penalty time" : "Penalty pts") + '</th><th>Stage score</th><th>Place</th>' + (anySig ? '<th>Shooter e-sig.</th>' : "") + '</tr>';
  (d.rows || []).forEach(function(r){
    var name = '<b>' + e(r.no) + '</b> ' + e(r.title);
    if(r.none){ h += '<tr><td>' + name + '</td><td colspan="' + (cols - 1) + '" class="c">Not scored' + fnOf(r) + '</td></tr>'; return; }
    var sg = sigOf(r);
    h += '<tr><td>' + name + '</td>' + ["hz", "pz1", "pz2", "miss", "standing", "pen", "ns", "time", "penT"].map(function(k){ return '<td class="n">' + v(r[k]) + '</td>'; }).join("") +
      '<td class="n"><b>' + v(r.score) + '</b>' + fnOf(r) + '</td><td class="n">' + v(r.place) + '</td>' + (anySig ? '<td class="c">' + (sg ? '<img class="esig" src="' + e(sg) + '" alt="signed">' : "") + '</td>' : "") + '</tr>';
    if(r.by) h += '<tr class="shby"><td></td><td colspan="' + (cols - 1) + '">' + e(sheetByText(r)) + (r.dev ? ' <span class="muted">(' + e(r.dev) + ')</span>' : "") + '</td></tr>';
  });
  h += '</table>';
  var ov = d.ov;
  if(ov) h += '<table class="shtot"><tr><th>Match total</th><td><b>' + e(ov.total) + '</b></td><th>Overall place</th><td><b>' + e(ov.place) + '</b>' + (ov.of && /^\d/.test(ov.place) ? ' of ' + e(ov.of) : "") + '</td></tr></table>';
  if(fns.length) h += '<ol class="shfn">' + fns.map(function(f){ return '<li>Stage ' + e(f.no) + ': ' + e(f.text) + '</li>'; }).join("") + '</ol>';
  if(m.note) h += '<div class="shmnote"><b>Match note:</b> ' + e(m.note) + '</div>';
  h += '<div class="shnote">' + (ov ? e(ov.label) + ' · ' : "") + e(d.method || "") + '. Every score is stamped digitally on the scoring phone with the Range Officer’s name and the time' + (anySig ? '; e-sig. = the shooter’s signature captured on the scoring phone' : "") + '.</div>';
  h += '<div class="shfoot">Spectre Scoring ' + e(d.ver || "") + (printed ? ' · ' + e(printed) : "") + (d.vt && typeof spVerifyBlock === "function" ? spVerifyBlock(d.vt) : "") + '</div></div>';
  return h;
}

(function(){
  /* Public, signed-out, read-only: fetches ONE doc, verify/{token}, over the Firestore REST API (no SDK, no archive navigation, nothing stored). */
  var app = document.getElementById("app"), e = shEsc;
  var tok = (location.hash.match(/[#&]t=([A-Za-z0-9_-]{22,64})(?:&|$)/) || [])[1];
  function msg(t, sub){ app.innerHTML = '<div class="badge bad">' + e(t) + (sub ? '<small>' + e(sub) + '</small>' : "") + '</div>'; }
  if(!tok){ msg("No score sheet code in this link.", "Scan the QR code on a Spectre Tactical score sheet."); return; }
  var cfg = window.SS_FIREBASE_TEST || window.SS_FIREBASE_CONFIG;
  var path = "projects/" + cfg.projectId + "/databases/(default)/documents/verify/" + tok;
  var url = cfg.emulator ? "http://" + cfg.emulator + ":8085/v1/" + path : "https://firestore.googleapis.com/v1/" + path + "?key=" + encodeURIComponent(cfg.apiKey);
  fetch(url, { cache: "no-store" }).then(function(r){
    if(r.status === 404) throw new Error("nf"); if(!r.ok) throw new Error("http"); return r.json();
  }).then(function(doc){
    var f = doc.fields || {}, hidden = f.hidden && f.hidden.booleanValue, data = f.data && f.data.stringValue;
    if(hidden || !data){ msg("This copy has been withdrawn from the archive.", "Ask the Match Director for the current results."); return; }
    var rid = (f.rid && f.rid.stringValue) || "";
    var d = JSON.parse(data), at = d.publishedAt ? String(d.publishedAt).slice(0, 10) : "";
    if(d.kind === "attendance"){ /* re-derived from the publisher-written public results copies; nothing in this doc is trusted except the admin-linked name */
      var base = url.split("/verify/")[0] + "/verify/", key = url.indexOf("?") >= 0 ? url.slice(url.indexOf("?")) : "";
      var rts = (d.rts || []).filter(function(t){ return /^[A-Za-z0-9_-]{22,64}$/.test(t); }).slice(0, 60);
      Promise.all(rts.map(function(t){ return fetch(base + t + key, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(x){
        var g = x && x.fields || {}; if(!g.data || !g.data.stringValue || (g.hidden && g.hidden.booleanValue)) return null; var y = JSON.parse(g.data.stringValue); return y.kind === "results" ? y : null; }).catch(function(){ return null; }); }))
      .then(function(docs){ var rows = atRows(d.name || "", docs.filter(Boolean));
        document.title = (d.name || "Shooter") + " – verified attendance";
        if(!rows.length){ msg("No published results were found for this attendance record."); return; }
        app.innerHTML = '<div class="badge">✔ Verified attendance record, rebuilt from the Spectre Tactical Shooting results archive<small>' + e(d.name || "") + " · " + rows.length + " shoot" + (rows.length === 1 ? "" : "s") + (at ? " · published " + e(at) : "") + '</small></div>' +
          '<div class="paper"><h2 style="margin:0 0 4mm;font-family:var(--cond);color:var(--navy)">' + e(d.name || "") + '</h2>' + atTable(rows) + '</div>'; });
      return; }
    if(d.kind === "results"){ var mt = d.match || {};
      document.title = (mt.name || "Results") + " – verified results";
      app.innerHTML = '<div class="badge">✔ Verified copy of the results from the Spectre Tactical Shooting archive<small>' + e(mt.name || "") + (at ? " · published " + e(at) : "") + '</small></div>' +
        '<div class="paper rp"><h2>' + e(mt.name || "Results") + '</h2><p class="rmeta">' + [mt.date && "Date: " + mt.date, mt.venue && "Venue: " + mt.venue, mt.md && "Match Director: " + mt.md, "Record: " + rid].filter(Boolean).map(e).join(" · ") + '</p>' +
        (d.tables || []).map(function(t){ return '<h3>' + e(t.t) + '</h3>' + (t.s ? '<p class="rmeta">' + e(t.s) + '</p>' : "") + '<div class="rtw"><table class="rt"><thead><tr>' + (t.h || []).map(function(h){ return '<th>' + e(h) + '</th>'; }).join("") + '</tr></thead><tbody>' +
          (t.r || []).map(function(r){ return '<tr>' + (r || []).map(function(c){ return '<td>' + e(c) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>'; }).join("") + '</div>';
      return; }
    document.title = (d.sh && d.sh.name || "Score sheet") + " – " + (d.match && d.match.name || "") + " – verified";
    app.innerHTML = '<div class="badge">✔ Verified copy from the Spectre Tactical Shooting archive<small>' + e((d.match && d.match.name) || "") + (at ? " · published " + e(at) : "") + '</small></div>' +
      '<div class="paper">' + sheetRender(d, null, "Verified copy" + (at ? " (published " + at + ")" : "")) + '</div>';
  }).catch(function(er){
    if(er && er.message === "nf") msg("This score sheet code was not found.", "The sheet may not be published, or the QR code is damaged.");
    else msg("Could not check this score sheet right now.", "Check your internet connection and try again.");
  });
})();
</script>

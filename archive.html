<header><h1>Spectre Tactical Shooting – score sheet archive</h1><div class="sub">Published match results. Find your name to view or download your score sheet.</div></header>

<h2>Club match rules</h2>
<a class="rbook" href="spectre-rules-2026.pdf" download="spectre-rules-2026.pdf">&#11015; Download the 2026 rulebook (PDF)</a>
<p class="small muted" style="margin:6px 0 12px">Spectre Tactical Shooting – Rules, Classes and Divisions · Second Edition, effective 2026 · 29 Dec 2025 · 85 pages, 0.9 MB</p>
<p class="small muted">How Spectre Tactical club matches are scored. Summary of the Spectre Tactical Shooting Rules, Classes and Divisions, 2nd Edition (2026), Chapter 4. The rulebook is the final authority; page numbers are the book’s printed pages.</p>
<h3>Stage score: time plus penalties</h3>
<p>Club shoots use the <b>negative scoring model</b> (shot timer). Your stage score is your raw time in seconds plus penalty seconds (§4.1.2, §4.2.4, p.60 and 64). <b>All rounds count.</b></p>
<table><tr><th>What the RO records</th><th style="text-align:right">Adds</th></tr>
<tr><td>Hit Zone (HZ) – A zone / down zero, or falling steel that falls</td><td class="v">+0 s</td></tr>
<tr><td>Peripheral Zone I (PZI) – C zone / down one</td><td class="v">+1 s</td></tr>
<tr><td>Peripheral Zone II (PZII) – D zone / down three</td><td class="v">+3 s</td></tr>
<tr><td>Miss</td><td class="v">+7 s</td></tr>
<tr><td>No-shoot or hostage hit (each)</td><td class="v">+7 s</td></tr>
<tr><td>Falling steel left standing (each plate)</td><td class="v">+7 s</td></tr>
<tr><td>Procedural penalty (each)</td><td class="v">+3 s</td></tr>
<tr><td>Target not engaged (scored as two misses)</td><td class="v">+14 s</td></tr>
</table>
<p class="small muted">Sources: §4.2.2 p.61-62 (zones, misses), §4.2.2.1 p.62 (falling steel), §4.2.4 p.64 (not engaged), §4.4.2 and §4.4.4 p.68-69 (procedurals, no-shoots). Cover bonuses (§4.2.3) apply only where the stage brief says so.</p>
<h3>Match result</h3>
<ul>
<li>Your match total is the sum of your stage scores. <b>The lowest total wins.</b></li>
<li><b>Ties</b> go to the shooter with the most HZ hits over the match; if still equal, the place is shared.</li>
<li>Each stage is also ranked on its own, lowest stage score first.</li>
</ul>
<h3>DNF and DQ</h3>
<ul>
<li><b>DNF (did not finish):</b> a shooter who does not finish a stage is <b>not ranked overall</b>. Their finished stages still stand and are ranked on those stage results.</li>
<li><b>DQ (disqualified):</b> unsafe firearm handling is not penalised, it results in immediate disqualification (§4.6, p.72). A disqualified shooter is <b>removed from the match results</b>.</li>
</ul>
<h3>Scoring and corrections</h3>
<ul>
<li>Range Officers score on their phones; every score sheet shows who scored each stage and when.</li>
<li>Where the Match Director corrects a score (for example an arithmetic error on a paper sheet), the correction is shown as a footnote on the score sheet and in the results.</li>
<li>Competitors are given the benefit of any reasonable doubt (§4.4).</li>
</ul>
</div></template>

<script>
/* ===================== score sheet renderer – shared by the app (print / PDF) and the public archive page =====================
   Input is a plain, JSON-safe sheet object (see sheetData in s-sheets.js), so the archive can draw the same layout from published data.
   d = { match:{name,date,venue,md,note}, neg, ver, sh:{name,no,member,squad,divs,cat,visitor}, rows:[{no,title,none,note}|{no,title,note,hz,pz1,pz2,miss,standing,pen,ns,time,penT,score,place,by,at,sigKey}], ov:{total,place,of,label}, method }
   sigs (optional) = { sigKey: dataURL } – the shooter's e-signature column appears only when at least one exists. */
function shEsc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function sheetByText(r){ return r && r.by ? "Scored by " + r.by + (r.at ? " · " + r.at : "") : ""; }
function sheetRender(d, sigs, printed){
  var e = shEsc, m = d.match || {}, sh = d.sh || {}, v = function(x){ return x == null || x === "" ? "" : e(x); };
  var sigOf = function(r){ return r && r.sigKey && sigs ? sigs[r.sigKey] : null; }, anySig = (d.rows || []).some(function(r){ return !!sigOf(r); });
  var h = '<div class="sheet"><div class="shhead"><div><h1>' + e(m.name) + '</h1><div>' + e(m.date) + (m.venue ? ' · ' + e(m.venue) : "") + (m.md ? ' · Match Director: ' + e(m.md) : "") + '</div></div><div class="shtag">Score sheet</div></div>';
  h += '<table class="shinfo"><tr><th>Shooter</th><td><b>' + e(sh.name) + '</b>' + (sh.visitor ? ' <span class="vis">VISITOR</span>' : "") + '</td><th>Shooter no.</th><td>' + v(sh.no) + '</td></tr>' +
    '<tr><th>Member no.</th><td>' + (sh.member ? e(sh.member) : sh.visitor ? "Visitor (not a club member)" : "") + '</td><th>Squad</th><td>' + v(sh.squad) + '</td></tr>' +
    '<tr><th>Division(s)</th><td colspan="3">' + e(sh.divs) + (sh.cat ? ' · Category: ' + e(sh.cat) : "") + '</td></tr></table>';
  var fns = [], fnOf = function(r){ if(!r || !r.note) return ""; fns.push({ no: r.no, text: r.note }); return '<sup class="fn">' + fns.length + '</sup>'; };
  var cols = 12 + (anySig ? 1 : 0);
  h += '<table class="shst"><tr><th>Stage</th><th>HZ</th><th>PZI</th><th>PZII</th><th>Miss</th><th>Steel standing</th><th>Proc. / pen.</th><th>No-shoot</th><th>Raw time</th><th>' + (d.neg ? "Penalty time" : "Penalty pts") + '</th><th>Stage score</th><th>Place</th>' + (anySig ? '<th>Shooter e-sig.</th>' : "") + '</tr>';
  (d.rows || []).forEach(function(r){
    var name = '<b>' + e(r.no) + '</b> ' + e(r.title);
    if(r.none){ h += '<tr><td>' + name + '</td><td colspan="' + (cols - 1) + '" class="c">Not scored' + fnOf(r) + '</td></tr>'; return; }
    var sg = sigOf(r);
    h += '<tr><td>' + name + '</td>' + ["hz", "pz1", "pz2", "miss", "standing", "pen", "ns", "time", "penT"].map(function(k){ return '<td class="n">' + v(r[k]) + '</td>'; }).join("") +
      '<td class="n"><b>' + v(r.score) + '</b>' + fnOf(r) + '</td><td class="n">' + v(r.place) + '</td>' + (anySig ? '<td class="c">' + (sg ? '<img class="esig" src="' + e(sg) + '" alt="signed">' : "") + '</td>' : "") + '</tr>';
    if(r.by) h += '<tr class="shby"><td></td><td colspan="' + (cols - 1) + '">' + e(sheetByText(r)) + (r.dev ? ' <span class="muted">(' + e(r.dev) + ')</span>' : "") + '</td></tr>';
  });
  h += '</table>';
  var ov = d.ov;
  if(ov) h += '<table class="shtot"><tr><th>Match total</th><td><b>' + e(ov.total) + '</b></td><th>Overall place</th><td><b>' + e(ov.place) + '</b>' + (ov.of && /^\d/.test(ov.place) ? ' of ' + e(ov.of) : "") + '</td></tr></table>';
  if(fns.length) h += '<ol class="shfn">' + fns.map(function(f){ return '<li>Stage ' + e(f.no) + ': ' + e(f.text) + '</li>'; }).join("") + '</ol>';
  if(m.note) h += '<div class="shmnote"><b>Match note:</b> ' + e(m.note) + '</div>';
  h += '<div class="shnote">' + (ov ? e(ov.label) + ' · ' : "") + e(d.method || "") + '. Every score is stamped digitally on the scoring phone with the Range Officer’s name and the time' + (anySig ? '; e-sig. = the shooter’s signature captured on the scoring phone' : "") + '.</div>';
  h += '<div class="shfoot">Spectre Scoring ' + e(d.ver || "") + (printed ? ' · ' + e(printed) : "") + '</div></div>';
  return h;
}

</script>
<script>
/* ===== archive results pack: Gunny's club-shoot pack (A4 landscape) rebuilt from the published archive data =====
   Same pages as the app's Results pack (s-pack.js): overall, one page per stage, score check. Score notes are footnotes.
   Uses only public archive fields (names, numbers, hits, times, scores, notes). */
var APK_D = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], APK_M = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function apkDate(iso, short){ var d = new Date(String(iso || "") + "T12:00:00"); if(isNaN(d)) return String(iso || ""); return short ? APK_D[d.getDay()].slice(0,3) + " " + d.getDate() + " " + APK_M[d.getMonth()].slice(0,3) + " " + d.getFullYear() : APK_D[d.getDay()] + " " + d.getDate() + " " + APK_M[d.getMonth()] + " " + d.getFullYear(); }
function apkNum(v){ var n = parseFloat(String(v == null ? "" : v).replace(/[^\d.\-]/g, "")); return isNaN(n) ? null : n; }
function apkF2(n){ return n == null ? "" : (Math.round(n * 100) / 100).toFixed(2); }
function apkPages(m){
  var E = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); };
  var mt = m.match || {}, sheets = m.sheets || [], pages = [];
  /* stages from the rows (or the published stage list when present) */
  var stMap = {};
  sheets.forEach(function(s){ (s.rows || []).forEach(function(r){ if(!stMap[r.no]) stMap[r.no] = { no: r.no, title: r.title }; }); });
  (m.stages || []).forEach(function(s){ stMap[s.no] = Object.assign(stMap[s.no] || {}, s); });
  var stages = Object.keys(stMap).map(function(k){ return stMap[k]; }).sort(function(a, b){ return a.no - b.no; });
  var isNum = function(v){ return typeof v === "number"; };
  var cnt = function(r){ return isNum(r.hz) ? r.hz + r.pz1 + r.pz2 + r.miss : null; };

  p += '</table>';

}

<script>

    if(rules){ app.innerHTML = RULES_HTML; return; }
    if(h.st) return showStandings(h.y, h.b);
